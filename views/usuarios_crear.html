    <script>
        let token;
        let user;

        window.onload = async function() {
            token = localStorage.getItem("token");
            user = JSON.parse(localStorage.getItem("user"));

            if (!token) {
                window.location.href = "bloqueo.html";
                return;
            }

            if (user.Usertype_Id !== 1) {
                window.location.href = "index.html";
            }

            await cargarTiposUsuario();
        

            function modal_message(msgTitle, info, showLoading){         
                msgShow_Simple(msgTitle, info, showLoading);
            }

            //Verificamos validacion en cada control
            function validar(){    //Verificamos validacion en cada control
                var isValid=false;
                msgvalidarcontrols = "";

                // VALIDACION EXISTENCIAS
                if( !validate_result("exists",$("#nombreCompleto").val(), "nombreCompleto"))            
                    msgvalidarcontrols = "<span class='badge badge-danger badge-text'> Debe digitar el nombre real </span>  ";

                if( !validate_result("exists",$("#usuario").val(), "usuario"))           
                    msgvalidarcontrols += "<span class='badge badge-danger badge-text'> Debe digitar un correo electrónico.</span>  ";

                if( !validate_result("exists",$("#telefono").val(), "telefono"))           
                    msgvalidarcontrols += "<span class='badge badge-danger badge-text'> Debe digitar un número celular.</span>  ";

                if( !validate_result("exists",$("#email").val(), "email"))            
                    msgvalidarcontrols += "<span class='badge badge-danger badge-text'> Debe digitar un usuario SIN ESPACIOS </span>  ";

                if( !validate_result("lists",$("#tipoUsuario").val(), "tipoUsuario"))           
                    msgvalidarcontrols += "<span class='badge badge-danger badge-text'> Debe seleccionar un tipo de usuario.</span>  ";

                if( !validate_result("exists",$("#newpassword").val(), "newpassword"))            
                    msgvalidarcontrols += "<span class='badge badge-danger badge-text'> Debe digitar una contraseña.</span>  ";
             
                if( !validate_result("exists",$("#newpasswordrepeat").val(), "newpasswordrepeat"))            
                    msgvalidarcontrols += "<span class='badge badge-danger badge-text'> Debe repetir la contraseña.</span>  ";


                //si coloco nueva contraseña, verifica que la repita
                if( valida_Existencia($("#newpassword").val()) ){            
                    if( valida_Existencia($("#newpasswordrepeat").val()) ){                                  
                        //verifica que Repetir y nueva clave sean las mismas
                        $("#newpasswordrepeat").removeClass("is-invalid"); 
                        if ($("#newpassword").val() != $("#newpasswordrepeat").val()){              
                            msgvalidarcontrols += "<span class='badge badge-danger'> Las contraseñas no coinciden.</span>  ";  
                            $("#newpasswordrepeat").addClass("is-invalid"); 
                        }
                    }
                }
                      
                if (msgvalidarcontrols == "") isValid=true; //si no cargo texto de validacion todo esta bn
                

                return isValid;
            }//fin validacion en cada control 


            // Cargar tipos de usuario desde el endpoint
            async function cargarTiposUsuario() {
                const tipoUsuarioSelect = document.getElementById("tipoUsuario");
                tipoUsuarioSelect.innerHTML = '<option value="">Cargando...</option>';

                try {
                    const response = await axios.get(`${getServerUrl()}/users/types`, {
                        headers: { Authorization: `Bearer ${token}` }
                    });

                    const tipos = response.data;
                    tipoUsuarioSelect.innerHTML = '<option value="">Seleccionar...</option>';

                    tipos.forEach(tipo => {
                        const option = document.createElement("option");
                        option.value = tipo.value;
                        option.textContent = tipo.label;
                        tipoUsuarioSelect.appendChild(option);
                    });

                } catch (error) {
                    console.error("Error al cargar tipos de usuario:", error);
                    tipoUsuarioSelect.innerHTML = '<option value="">Error al cargar</option>';
                }
            }


            document.getElementById('btnGuardar').addEventListener("click", async function (e) {
            e.preventDefault(); 


                if(validar()){ 
                    
                    const ident = document.getElementById('identificacion').value.trim();
                    const nombre = document.getElementById('nombreCompleto').value.trim();
                    const usuario = document.getElementById('usuario').value.trim();
                    const telefono = document.getElementById('telefono').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const tipoUsuario = document.getElementById('tipoUsuario').value;
                    const password = document.getElementById('newpassword').value;


                    try {
                        const response = await axios.post(`${getServerUrl()}/users/create`, {
                            User_Id: ident,
                            User_Names: nombre,
                            User_Mail: email,
                            User_Phone: telefono,
                            User_Name: usuario,
                            User_Password: password,
                            Usertype_Id: tipoUsuario,
                            Userstatus_Id: 1
                        }, {
                            headers: { Authorization: `Bearer ${token}` }
                        });

                        modal_message("Registrar Usuario", "0 Usuario registrado correctamente", 0);
                        document.getElementById('form-user').reset();

                    } catch (error) {
                            console.error("Error al registrar usuario:", error);
                            console.log("Detalle del error:", error.response?.data);

                            const msg = error.response?.data?.detail || "Error al registrar usuario. Verifique los datos.";
                            modal_message("Registrar Usuario", `1 ${msg}`, 0);

                    }

                        
                            
                        
                }else{
                    modal_message("Validando información requerida", "-1 Complete la información en los campos marcados.<br>"+msgvalidarcontrols, 0); 
                    
                }//END IF
            });
        };
        
        
    </script>
